[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-tellurium"
version = "0.1.2"
description = "Process-bigraph wrapper for Tellurium / libroadrunner SBML simulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "process-bigraph>=1.8.5",
    "bigraph-schema",
    "viva-superpowers",
    "tellurium>=2.2",
    "libroadrunner>=2.11.0",
    "numpy",
    "pyyaml",
    "bigraph-viz>=2.0.3",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
cli = ["typer", "rich"]
dev = ["pytest", "bigraph-viz", "matplotlib"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["viva_tellurium*", "pbg_tellurium"]  # pbg_tellurium = deprecation shim

[project.scripts]
viva-tellurium = "viva_tellurium.cli.__main__:main"
