[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-tellurium"
version = "0.1.2"
description = "Process-bigraph wrapper for Tellurium / libroadrunner SBML simulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=1.8.5",
    "bigraph-schema",
    "viva-superpowers",
    "tellurium>=2.2",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "bigraph-viz", "matplotlib"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["viva_tellurium*", "pbg_tellurium"]  # pbg_tellurium = deprecation shim
