[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-tellurium"
version = "0.2.3"
description = "Process-bigraph wrapper for Tellurium / libroadrunner SBML simulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "process-bigraph>=1.8.5",
    "bigraph-schema",
    "tellurium>=2.2",
    "libroadrunner>=2.11.0",
    "numpy",
    "pyyaml",
    "typer",
    "rich",
    # tellurium's visualization/sbmldiagram.py imports six without declaring it, so a clean install fails with
    # ModuleNotFoundError: six. The upstream fix belongs in tellurium; this declares the runtime requirement here.
    "six",
]

[project.optional-dependencies]
# The workbench dashboard and its Visualization steps; not needed by the simulation path
# (see tests/test_compose_contract.py). vivarium-workbench serves the workspace, viva-superpowers provides the
# Visualization base class, and the workbench inlines plotly.js from plotly in investigation reports.
dashboard = ["viva-superpowers", "vivarium-workbench", "plotly"]
# Kept for compatibility with `viva-tellurium[cli]`; typer and rich are base dependencies since 0.2.0.
cli = ["typer", "rich"]
dev = ["pytest", "bigraph-viz", "matplotlib", "jsonschema[format-nongpl]>=4.21", "jinja2>=3.1", "pypdf>=4.0", "viva-tellurium[dashboard]"]

# The workspace image (Dockerfile, Singularity.def, both generated from viva-template) runs
# `uv sync --no-install-project` and then serves the workbench. That command installs no extras, but it does install
# the default dependency groups, so the dashboard extra rides along here. Groups are not package metadata, so
# `pip install viva-tellurium` is unaffected.
[dependency-groups]
workbench = ["viva-tellurium[dashboard]"]

[tool.uv]
default-groups = ["workbench"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
# From git, as viva-template v0.1.0 pins it: PyPI's vivarium-workbench 0.3.92 imports `workspace_catalog`, which
# viva-superpowers 0.25 no longer has, so `vivarium-workbench serve` crashed in the image.
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["viva_tellurium*", "pbg_tellurium"]  # pbg_tellurium = deprecation shim

[tool.setuptools.package-data]
viva_tellurium = ["composites/*.yaml"]

[project.scripts]
viva-tellurium = "viva_tellurium.cli.__main__:main"
